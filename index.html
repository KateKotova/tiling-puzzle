<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css">
    <title>TilingPuzzle</title>
    <style>
        :root {
            --background-color: #1099bb;
            --loading-color: #152E38;
            --loading-stroke-width: 0.7087;
            --loading-ray-color: #C9F6FF;
            --loading-opacity-animation-time: 0.5s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--background-color);
        }

        #loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--background-color);
            z-index: 10;
            transition: opacity var(--loading-opacity-animation-time) ease;
        }

        #loading-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading-svg {
            max-height: 50vh;
            max-width: 50vw;
            width: auto;
            height: auto;
            display: block;
        }

        #app {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            transition: opacity var(--loading-opacity-animation-time) ease;
            z-index: 1;
        }

        #app.visible {
            opacity: 1;
        }

        #pixi-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
